[package]
name = "trust-bo"
version = "0.1.0"
edition = "2021"

[lib]
name = "trust_bo"
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = { version = "0.8", features = ["std_rng"] }

burn = { version = "0.16", features = ["ndarray", "autodiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "branin_demo"
path = "src/bin/branin_demo.rs"
